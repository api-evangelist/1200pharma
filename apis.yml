aid: 1200pharma
name: 1200 Pharma
description: >-
  1200 Pharma LLC is a privately held pre-clinical drug discovery company founded in 2017 and
  headquartered in Culver City, California, with roots in Pasadena. It was launched by Caltech
  chemist Brian Stoltz, UCLA translational oncologist Dennis Slamon and chief executive David
  Licata, and it pairs Caltech medicinal-chemistry methodology with UCLA biomarker-driven
  screening assays to identify novel small-molecule oncology candidates — including KRAS and CDK
  inhibitors — at a fraction of the industry-average cost and timeline. The company employs
  roughly 20-50 people, has filed patents covering indole-based anti-cancer compounds, and has
  raised approximately $14.1 million from Kairos Ventures, Vest Coast Capital, OCV Partners,
  Alexandria Venture Investments, Pasadena Bio and the National Institutes of Health. Its product
  is drug intellectual property and discovery partnerships, not software: no developer program,
  public API, SDK, developer portal or machine-readable contract of any kind could be found, and
  no api/docs/developer hostname exists under its domain. At the time of profiling its only web
  property, 1200pharma.com, was not being served — the Cloudflare edge in front of it terminated
  every TLS handshake and answered plain HTTP with error 1001 — so the corporate site itself could
  not be read.
